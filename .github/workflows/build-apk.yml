name: Build Flutter APK

on:
  push:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Install dependencies
        run: cd NeuroDePIN/neuro_app && flutter pub get

      - name: Robustly Fix Telephony Package for AGP 8+
        run: |
          python3 -c '
          import re
          path = "/home/runner/.pub-cache/hosted/pub.dev/telephony-0.2.0/android/build.gradle"
          try:
              with open(path, "r") as f:
                  content = f.read()
              
              if "namespace" not in content:
                  content = content.replace("android {", "android {\n    namespace \"com.shounakmulay.telephony\"")
              
              # Remove old SDK versions to inherit safely from root project
              content = re.sub(r"minSdkVersion\s+\d+", "", content)
              content = re.sub(r"targetSdkVersion\s+\d+", "", content)
              
              with open(path, "w") as f:
                  f.write(content)
              print("Successfully patched telephony build.gradle via Python")
          except Exception as e:
              print(f"Skipping patch: {e}")
          '
          
          # Clean manifest package attribute if present
          MANIFEST_FILE="/home/runner/.pub-cache/hosted/pub.dev/telephony-0.2.0/android/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_FILE" ]; then
            sed -i 's/package="[^"]*"/ /g' "$MANIFEST_FILE"
          fi

      - name: Build APK
        run: cd NeuroDePIN/neuro_app && flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: NeuroDePIN/neuro_app/build/app/outputs/flutter-apk/app-release.apk