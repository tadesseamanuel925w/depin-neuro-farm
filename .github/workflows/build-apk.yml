name: Build Flutter APK

on:
  push:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Install dependencies
        run: cd NeuroDePIN/neuro_app && flutter pub get

      - name: Fix telephony package namespace and JVM target
        run: |
          FILE="/home/runner/.pub-cache/hosted/pub.dev/telephony-0.2.0/android/build.gradle"
          if [ -f "$FILE" ]; then
            echo "Adding namespace and fixing JVM target in telephony package..."
            sed -i '/android {/a \    namespace "com.roughike.telephony"\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_1_8\n        targetCompatibility JavaVersion.VERSION_1_8\n    }\n    kotlinOptions {\n        jvmTarget = "1.8"\n    }' "$FILE"
          fi

      - name: Build APK
        run: cd NeuroDePIN/neuro_app && flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: NeuroDePIN/neuro_app/build/app/outputs/flutter-apk/app-release.apk